name: Full Git history secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks-full-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all Git history with redacted findings
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:latest \
            git --redact --no-banner --log-opts="--all" /repo
