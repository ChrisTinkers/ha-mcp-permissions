name: "HA MCP Config Reader"
version: "1.1.0"
slug: "ha_mcp_config_reader"
description: "Read-only, allowlisted Home Assistant package YAML MCP server"
url: "https://github.com/ChrisTinkers/ha-mcp-permissions"
arch:
  - amd64
startup: application
boot: auto
init: false
host_network: false
homeassistant_api: false
hassio_api: false
auth_api: false
docker_api: false
map:
  - config:ro
ports:
  8766/tcp: null
ports_description:
  8766/tcp: "Internal-only MCP endpoint; do not publish"
options:
  access_key: ""
  allowed_files:
    - hauswartung.yaml
schema:
  access_key: password
  allowed_files:
    - str
